<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оценка качества звонка</title>
<link rel="stylesheet" href="css/styles.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<div class="bar">
  <input type="file" id="file" accept=".json,application/json" hidden>
  <button id="pick" data-i18n="bar.upload" data-i18n-title="bar.upload.title">Загрузить JSON</button>
  <select id="filter" data-i18n-title="bar.filter.title"></select>
  <select id="rec" data-i18n-title="bar.rec.title"></select>
  <button id="start" class="primary" disabled data-i18n="bar.start">Оценить звонок</button>
  <button id="all" disabled></button>
  <button id="results-json" disabled data-i18n="bar.results" data-i18n-title="bar.results.title">Скачать results.json</button>
  <button id="csv" disabled data-i18n="bar.csv">Скачать таблицу (CSV)</button>
  <span class="status" id="status"></span>
  <button id="settings" data-i18n="bar.settings" data-i18n-title="bar.settings.title">Настройки</button>
  <button id="criteria" data-i18n="bar.criteria" data-i18n-title="bar.criteria.title">Редактор критериев</button>
  <select id="lang" data-i18n-title="lang.title"><option value="ru">RU</option><option value="kk">KZ</option><option value="en">EN</option></select>
</div>

<!-- side tab: switches between operator and reviewer mode -->
<button id="modeTab" class="mode-tab" aria-pressed="false"><span data-i18n="mode.reviewer">Режим проверяющего</span></button>

<div class="frame">
  <div class="left">
    <!-- Окно 1 -->
    <section class="box" id="w1">
      <h2><span data-i18n="w1.title">Окно 1 · Расшифровка</span><span id="fname"></span></h2>
      <details class="cpanel" id="cpanel" open>
        <summary><span data-i18n="cp.title">Критерии оценки</span> <span class="muted" id="cpCount"></span></summary>
        <p class="muted cp-hint" data-i18n="cp.hint"></p>
        <div id="cpList"></div>
        <div class="cp-warn" id="cpWarn" hidden data-i18n="cp.nonStd"></div>
      </details>
      <div class="player" id="player" hidden>
        <audio id="audio" controls preload="none"></audio>
        <input type="file" id="audioFile" accept="audio/*,video/*" hidden>
        <button class="link" id="attachAudio" data-i18n="player.attach" data-i18n-title="player.attach.title">Прикрепить аудио</button>
        <div class="player-err" id="audioErr" hidden data-i18n="player.error"></div>
      </div>
      <div class="scroll" id="transcript"><div class="empty" data-i18n="w1.empty"></div></div>
    </section>
    <!-- Окно 2 -->
    <section class="box b2" id="w2">
      <div class="op-only">
        <p data-i18n="w2.prompt">Хотите увидеть итоговую оценку диалога?</p>
        <button id="showScore" disabled data-i18n="w2.show">Показать итоговую оценку</button>
      </div>
      <div class="rv-only">
        <p data-i18n="w2.reviewPrompt">Решение по апелляции</p>
        <div class="decide">
          <button id="confirmScore" class="primary" disabled data-i18n="w2.confirm" data-i18n-title="w2.confirm.title">Подтвердить оценку</button>
          <button id="reviseScore" disabled data-i18n="w2.revise" data-i18n-title="w2.revise.title">Пересмотреть оценку</button>
        </div>
        <div class="note" id="decideNote"></div>
      </div>
    </section>
  </div>

  <div class="right">
    <div class="right-top">
      <!-- Окно 3 -->
      <section class="box" id="w3">
        <h2><span data-i18n="w3.title">Окно 3 · Оценка по критериям</span><span id="w3total"></span></h2>
        <div class="scroll" id="results"><div class="empty" data-i18n="w3.empty"></div></div>
      </section>
      <!-- Окно 6 -->
      <section class="box" id="w6">
        <h2><span data-i18n="w6.title">Окно 6 · Момент в диалоге</span></h2>
        <div class="scroll" id="moment"><div class="empty" data-i18n="w6.empty"></div></div>
      </section>
    </div>

    <div class="right-bottom">
      <!-- Окно 4 -->
      <section class="box" id="w4">
        <h2><span id="w4title" data-i18n="w4.title">Окно 4 · Оспаривание</span><span id="appealStatus"></span></h2>
        <div class="scroll" id="disputes"><div class="empty" data-i18n="w4.empty"></div></div>
      </section>
      <!-- Окно 5 -->
      <section class="box b5" id="w5">
        <div class="op-only">
          <button id="saveAppeal" disabled data-i18n="w5.saveDraft">Сохранить обращение</button>
          <button id="send" class="primary" disabled data-i18n="w5.send">Сохранить и отправить</button>
        </div>
        <div class="rv-only">
          <button id="saveReview" class="primary" disabled data-i18n="w5.saveReview">Сохранить ответы</button>
        </div>
        <div class="note" id="sendNote"></div>
      </section>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <div class="big"><span id="scoreNum">0</span><small>/100</small></div>
    <div class="crit-warn" id="scoreCrit" hidden data-i18n="modal.critical"></div>
    <div class="sub" id="scoreSub"></div>
    <button id="closeModal" data-i18n="modal.close">Закрыть</button>
  </div>
</div>

<!-- Настройки: какие критерии доступны в окне 1 и их вес -->
<dialog id="setDlg" class="ck-dlg set-dlg">
  <div class="ck-top"><h3 data-i18n="settings.title">Настройки критериев</h3></div>
  <p class="muted" data-i18n="settings.hint"></p>
  <div id="setList"></div>
  <div class="ck-foot">
    <span class="ck-err" id="setErr"></span>
    <span class="muted" id="setSum"></span>
    <button id="setCancel" data-i18n="settings.cancel">Отмена</button>
    <button id="setSave" class="primary" data-i18n="settings.save">Сохранить</button>
  </div>
</dialog>

<!-- Редактор критериев: тексты, шкалы, новые критерии -->
<dialog id="ckDlg" class="ck-dlg">
  <div class="ck-top">
    <h3 data-i18n="ed.title">Редактор критериев</h3>
    <span class="muted" id="ckVersion"></span>
  </div>
  <p class="muted" data-i18n="ed.hint"></p>
  <div id="ckList"></div>
  <button id="ckAdd" data-i18n="ed.add">+ Добавить критерий</button>
  <label for="ckRules" data-i18n="ed.rules">Общие правила для ИИ</label>
  <textarea id="ckRules" rows="6"></textarea>
  <div class="ck-foot">
    <span class="muted" id="ckSum"></span>
    <span class="ck-err" id="ckErr"></span>
    <button id="ckReset" data-i18n="ed.reset">Стандартный чек-лист</button>
    <button id="ckCancel" data-i18n="ed.cancel">Отмена</button>
    <button id="ckSave" class="primary" data-i18n="ed.save">Сохранить</button>
  </div>
</dialog>

</body>
</html>
